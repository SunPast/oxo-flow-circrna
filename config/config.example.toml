# circRNA Pipeline Configuration
# Copy to config.toml and set your reference directory

[config]
# === CORE: Set this one path, others derive from it ===
# All references are expected under this directory:
#   {reference_dir}/genome.fa
#   {reference_dir}/genome.fa.fai
#   {reference_dir}/genes.gtf
#   {reference_dir}/bwa/
#   {reference_dir}/bowtie2/
#   {reference_dir}/star/
#   {reference_dir}/hisat2/
#   {reference_dir}/hg38_ref.txt  (for CIRCexplorer2)
reference_dir = "/data/references/GRCh38"

# Override individual paths if needed (optional):
# reference_fasta = "/custom/path/genome.fa"
# gene_annotation = "/custom/path/genes.gtf"
# bwa_index = "/custom/bwa_index"
# bowtie2_index = "/custom/bowtie2_index"
# star_index = "/custom/star_index"
# hisat2_index = "/custom/hisat2_index"
# circexplorer2_ref = "/custom/hg38_ref.txt"

# CIRIquant internal config (auto-generated from above paths)
ciriquant_config = "config/ciriquant_hg38.yml"

# Sample sheet
samples = "samples.csv"

[defaults]
threads = 8
memory = "16G"

# circRNA Pipeline Configuration
# Copy to config.toml and update paths
#
# Option A (recommended): Set reference_dir — standard paths are auto-derived:
#   [config]
#   reference_dir = "/data/references/GRCh38"
#   samples = "samples.csv"
#
# Option B: Override individual paths below if your layout differs:

[config]
# === Reference Files ===
# reference_dir = "/data/references/GRCh38"  # Uncomment to auto-derive paths below
reference_fasta = "/data/references/GRCh38/genome.fa"
gene_annotation = "/data/references/GRCh38/genes.gtf"

# === Index Files (pre-built) ===
# BWA index for CIRIquant and CIRCexplorer2
bwa_index = "/data/references/GRCh38/bwa/genome.fa"

# Bowtie2 index for find_circ
bowtie2_index = "/data/references/GRCh38/bowtie2/genome.fa"

# STAR index for circRNA_finder
star_index = "/data/references/GRCh38/star"

# HISAT2 index for CIRIquant
hisat2_index = "/data/references/GRCh38/hisat2/genome.fa"

# CIRCexplorer2 reference (run: fetch_ucsc.py hg38 > hg38_ref.txt)
circexplorer2_ref = "/data/references/GRCh38/hg38_ref.txt"

# CIRIquant config (auto-generated)
ciriquant_config = "config/ciriquant_hg38.yml"

# Sample sheet (format: sample,r1_fastq,r2_fastq)
samples = "samples.csv"

[defaults]
threads = 8
memory = "16G"
